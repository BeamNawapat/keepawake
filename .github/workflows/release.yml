name: release

on:
  release:
    types: [published]

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      # The tag you type into the GitHub Release must match package.json, or
      # npm publishes a version nobody tagged (or refuses an existing one).
      - name: Tag matches package.json version
        run: |
          pkg=$(node -p "require('./package.json').version")
          tag="${GITHUB_REF_NAME#v}"
          if [ "$pkg" != "$tag" ]; then
            echo "package.json is $pkg but the release tag is $GITHUB_REF_NAME"; exit 1
          fi
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: bun test
      # Node 24 ships npm >= 11.5, which trusted publishing (OIDC) requires.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      # No token: npm exchanges the OIDC identity and adds provenance itself.
      - run: npm publish
