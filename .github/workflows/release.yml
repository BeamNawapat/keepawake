name: release

on:
  release:
    types: [published]

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      # The tag you type into the GitHub Release must match package.json, or
      # npm publishes a version nobody tagged (or refuses an existing one).
      - name: Tag matches package.json version
        run: |
          pkg=$(node -p "require('./package.json').version")
          tag="${GITHUB_REF_NAME#v}"
          if [ "$pkg" != "$tag" ]; then
            echo "package.json is $pkg but the release tag is $GITHUB_REF_NAME"; exit 1
          fi
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: bun test
      # Node 24 ships npm >= 11.5, which trusted publishing (OIDC) requires.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      # No token: npm exchanges the OIDC identity and adds provenance itself.
      - run: npm publish

  # The website shows the CLI version from a file that BeamNawapat/keepawake-site
  # syncs from npm every 15 minutes. Dispatching that workflow now makes it immediate.
  # Needs SITE_DISPATCH_TOKEN: a fine-grained PAT with Actions: write on keepawake-site.
  # Without the secret the cron still catches up, so this job only warns.
  rebuild-website:
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch cli-version workflow on keepawake-site
        env:
          GH_TOKEN: ${{ secrets.SITE_DISPATCH_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then echo "::warning::no SITE_DISPATCH_TOKEN secret; the site updates on its 15-minute cron"; exit 0; fi
          # npm can take a few minutes to serve the new dist-tag. Dispatching before
          # that makes the site sync a no-op (seen on v0.2.1), so poll first.
          want="${GITHUB_REF_NAME#v}"; got=""
          for i in $(seq 1 30); do
            got=$(curl -fsS https://registry.npmjs.org/-/package/@beamnawapat%2Fkeepawake/dist-tags | jq -r .latest)
            [ "$got" = "$want" ] && break
            echo "npm latest is $got, waiting for $want ($i/30)"; sleep 10
          done
          [ "$got" = "$want" ] || echo "::warning::npm still serves $got after 5 minutes; dispatching anyway, the cron catches up"
          gh workflow run cli-version.yml -R BeamNawapat/keepawake-site
