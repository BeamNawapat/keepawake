name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    env:
      # Keeps the smoke daemon's pid/state/log out of the runner's real home.
      KEEPAWAKE_HOME: ${{ github.workspace }}/.ci-keepawake-home
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test
      - run: bun run build
      - name: Smoke
        shell: bash
        run: |
          node dist/cli.js --version
          # No agent runs on a CI box, so exit 1 is expected here.
          node dist/cli.js check || true
          node dist/cli.js start --always -d
          node dist/cli.js status --json
      - name: Stop daemon
        if: always()
        shell: bash
        run: node dist/cli.js stop
      - run: npm pack --dry-run

  node18:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run build
      # Node comes after the build so the bundle is exercised on the minimum supported runtime.
      - uses: actions/setup-node@v4
        with:
          node-version: '18.17'
      - run: node dist/cli.js --version
      - run: node dist/cli.js check || true
