name: Bug report
description: Something does not work as expected
labels: [bug]
body:
  - type: input
    id: os
    attributes:
      label: OS and version
      placeholder: macOS 15.1, Windows 11 24H2, Ubuntu 24.04
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: keepawake version
      description: Output of `keepawake --version`
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: Command you ran
      render: shell
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected and what happened
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: Output of `keepawake doctor --json`
      description: Check it for anything private before pasting.
      render: json
    validations:
      required: true
